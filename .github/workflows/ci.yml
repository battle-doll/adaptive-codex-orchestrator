name: CI

on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'default' || format('isolated-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  offline-validation:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          plugins/adaptive-codex-orchestrator/hooks
          plugins/adaptive-codex-orchestrator/scripts
          plugins/adaptive-codex-orchestrator/tests

      - name: Run unit and fixture tests
        run: >-
          python -m unittest discover
          -s plugins/adaptive-codex-orchestrator/tests
          -p "test_*.py"
          -v

      - name: Validate policy eval dataset
        run: >-
          python
          plugins/adaptive-codex-orchestrator/scripts/evaluate_policies.py

      - name: Validate plugin package
        run: >-
          python
          plugins/adaptive-codex-orchestrator/scripts/validate_package.py
          --repo-root .

      - name: Build deterministic release artifact
        run: >-
          python
          plugins/adaptive-codex-orchestrator/scripts/build_release.py

      - name: Revalidate release artifact
        run: >-
          python
          plugins/adaptive-codex-orchestrator/scripts/validate_release_artifact.py
          plugins/adaptive-codex-orchestrator/dist/adaptive-codex-orchestrator-0.1.1.zip
          --trusted-source-root plugins/adaptive-codex-orchestrator
          --require-sidecar
